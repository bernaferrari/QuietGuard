[package]
name = "netguard-uniffi-bindgen"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
uniffi = { version = "0.32.0", features = ["cli"] }

[profile.dev]
# This crate is only a build-time code generator, so debug symbols just inflate
# Gradle's disposable Cargo cache.
debug = 0
