name: Setup Android NDK + Rust
description: JDK 21, Gradle, Android SDK, NDK from gradle.properties, Rust android target, Cargo cache

inputs:
  rust-targets:
    description: Comma-separated rustup targets
    required: false
    default: "aarch64-linux-android"
  rust-cache-key:
    required: false
    default: "rust-android-arm64"

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK (quietguard.ndkVersion)
      shell: bash
      run: |
        NDK="$(./scripts/quietguard-ndk-version.sh)"
        echo "Installing ndk;${NDK}"
        sdkmanager --install "ndk;${NDK}"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: app/src/main/rust
        shared-key: ${{ inputs.rust-cache-key }}
